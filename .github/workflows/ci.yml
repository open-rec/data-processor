name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out data processor
        uses: actions/checkout@v7
        with:
          path: data-processor
      - name: Check out protocol source
        uses: actions/checkout@v7
        with:
          repository: open-rec/rec-server
          path: rec-server
      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Install protocol artifact
        working-directory: rec-server
        run: mvn --batch-mode --no-transfer-progress -pl proto -am install -DskipTests
      - name: Run tests
        working-directory: data-processor
        run: mvn --batch-mode --no-transfer-progress clean test
